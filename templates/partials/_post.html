<article class="post">
  <a href="{{ post.get_absolute_url }}"><h3 class="post__title">{{ post.title }}</h3></a>
  <div class="post__meta">
    <span class="post__author">By {{ post.author.username }}</span>
    <span class="post__date">{{ post.created_at|date:'F j, Y' }}</span>
  </div>
</article>
