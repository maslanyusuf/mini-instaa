<article class="card">
  <div class="card-body">
    <p class="card-title mb-0">
      <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
    </p>
    <small class="card-text text-muted">By {{ post.author.username }}</small>
    <small class="card-text text-muted">{{ post.created_at|date:'F j, Y' }}</small>
  </div>
</article>
